<!DOCTYPE html>
<html>
<head>
  <title>Task App</title>
</head>
<body>
  <!-- CLIENT: the page the user sees -->
  <h2>Simple Task App</h2>
  <input id="title" placeholder="Enter a task">
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>

  <h3>Communication log</h3>
  <pre id="log"></pre>

  <script>
    function log(text) {
      document.getElementById("log").textContent += text + "\n";
    }

    // Ask the server for the tasks and show them
    async function loadTasks() {
      log("Client -> Server: GET /api/tasks");
      let response = await fetch("/api/tasks");
      let tasks = await response.json();
      log("Server -> Client: " + response.status + " (" + tasks.length + " tasks)");

      let list = document.getElementById("list");
      list.innerHTML = "";
      for (let task of tasks) {
        list.innerHTML += "<li>" + task + "</li>";
      }
    }

    // Send a new task to the server
    async function addTask() {
      let title = document.getElementById("title").value;
      log("Client -> Server: POST /api/tasks");
      let response = await fetch("/api/tasks", {
        method: "POST",
        body: JSON.stringify({ title: title })
      });
      let result = await response.json();
      log("Server -> Client: " + response.status + " " + result.message);
      document.getElementById("title").value = "";
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
